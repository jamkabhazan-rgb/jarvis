# nginx site config for JARVIS (static site).
# Placeholders __WEBROOT__ / __DOMAIN__ / __WWW_DOMAIN__ are substituted by deploy.sh.
# certbot --nginx adds the listen 443 / ssl_* lines and the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ __WWW_DOMAIN__;

    root __WEBROOT__;
    index JARVIS.html index.html;

    # Static assets caching
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Let's Encrypt HTTP-01 challenge (served before any redirect certbot adds)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
